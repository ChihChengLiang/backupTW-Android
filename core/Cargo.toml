[package]
name = "backuptw-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
unicode-general-category = "1.1.0"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.8"

